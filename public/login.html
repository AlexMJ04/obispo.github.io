<body class="flex items-center justify-center p-4">
  <div id="app" class="w-full max-w-md bg-white border border-outline-variant/60 rounded-2xl shadow-xl p-8 text-center relative overflow-hidden">
    <button @click="toggleTheme" class="fixed top-4 right-4 w-10 h-10 rounded-full bg-white dark:bg-[#162032] border border-outline-variant/60 dark:border-[#25354e] shadow-md hover:scale-105 active:scale-95 text-on-surface-variant dark:text-gray-300 transition-all flex items-center justify-center cursor-pointer z-50" :title="isDarkMode ? 'Modo Claro' : 'Modo Oscuro'">
      <span class="material-symbols-outlined text-[20px]">{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</span>
    </button>
    
    <!-- Header decoration -->
    <div class="absolute top-0 left-0 w-full h-2 bg-primary"></div>
    
    <div class="mb-8">
      <div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center text-on-primary mx-auto mb-4 shadow-md">
        <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">agriculture</span>
      </div>
      <h2 class="font-display text-2xl font-bold text-primary">Obispo Lácteo</h2>
      <p class="text-on-surface-variant text-sm mt-1">Gestión de Producción Pecuaria</p>
    </div>

    <!-- Error Alert Container -->
    <div v-if="errorMsg" class="mb-6 p-4 bg-error-container text-on-error-container border border-error/20 rounded-xl text-left flex gap-3 items-center">
      <span class="material-symbols-outlined text-error flex-shrink-0" style="font-variation-settings: 'FILL' 1;">error</span>
      <p class="text-sm font-medium">{{ errorMsg }}</p>
    </div>

    <form @submit.prevent="handleLogin" class="text-left space-y-5">
      <div>
        <label class="block font-medium text-on-surface-variant text-sm mb-1.5">Correo Electrónico</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/80 text-[20px]" data-icon="mail">mail</span>
          <input v-model="email" required type="email" class="w-full pl-11 pr-4 py-3 bg-surface border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all text-body-md" placeholder="admin@obispodairy.com"/>
        </div>
      </div>
      
      <div>
        <label class="block font-medium text-on-surface-variant text-sm mb-1.5">Contraseña</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/80 text-[20px]" data-icon="lock">lock</span>
          <input v-model="password" required :type="showPassword ? 'text' : 'password'" class="w-full pl-11 pr-12 py-3 bg-surface border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all text-body-md" placeholder="••••••••"/>
          <button type="button" @click="showPassword = !showPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
            <span class="material-symbols-outlined text-[20px]">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <button type="submit" :disabled="loading" class="w-full py-3.5 bg-primary text-on-primary font-bold rounded-xl shadow-md hover:brightness-110 active:scale-98 transition-all flex items-center justify-center gap-2 mt-8 disabled:opacity-70">
        <span v-if="loading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        <span>{{ loading ? 'Iniciando Sesión...' : 'Ingresar al Sistema' }}</span>
      </button>
    </form>
  </div>

  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
                    isDarkMode: false,
          email: '',
          password: '',
          showPassword: false,
          errorMsg: '',
          loading: false
        };
      },
      mounted() {
                const theme = localStorage.getItem('theme') || 'light';
                this.isDarkMode = theme === 'dark';
                if (this.isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }

        // Clear logged in user if they go to login page
        localStorage.removeItem('loggedInUser');
      },
      methods: {
                toggleTheme() {
                    this.isDarkMode = !this.isDarkMode;
                    if (this.isDarkMode) {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('theme', 'light');
                    }
                },

        async handleLogin() {
          this.errorMsg = '';
          this.loading = true;
          try {
            const res = await fetch('/api/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: this.email, password: this.password })
            });
            if (res.ok) {
              const user = await res.json();
              localStorage.setItem('loggedInUser', JSON.stringify(user));
              window.location.href = 'index.html';
            } else {
              let errorMessage = 'Error al iniciar sesión';
              try {
                const data = await res.json();
                errorMessage = data.error || errorMessage;
              } catch (jsonErr) {
                // Response body is not JSON
              }
              
              if (res.status === 401 || res.status === 403) {
                this.errorMsg = errorMessage;
                return;
              }
              if (res.status === 404) {
                this.localLoginFallback();
                return;
              }
              
              this.errorMsg = errorMessage;
            }
          } catch (err) {
            console.warn('Network error or server offline, trying local fallback authentication...', err);
            this.localLoginFallback();
          } finally {
            this.loading = false;
          }
        },
        localLoginFallback() {
          const fallbackUsers = [
            { id: 1, name: "Admin User", role: "Administrador", status: "Activo", email: "admin@obispodairy.com", password: "admin123", avatar: "https://lh3.googleusercontent.com/aida-public/AB6AXuCcSnQrQ5pnPKfo4ASmtyif9pnTArxqW6D57jMNAI1OZrT3aHyj4TR-0f8KA0_ZS766n_9nl0kQfZUNyQB8JTEUS1ZLo0SXHF29-p7ttfJRn2pwyAE3RBN0n4UodadbGH_bGS1fDMc_7NJyPkeOybCHd8OIjUX_uCmRHBWlcgvpTqv8durYfuWtoyJtiVkcF1EPwONiG_F34liZA5ptQ83TaZmgI6lgcPlwizpLfbp1yamU6mK7a3LXsi8H5rP4_EHBs3dza0xFBWE" },
            { id: 2, name: "Dra. Maria Mendoza", role: "Veterinario", status: "Activo", email: "veterinario@obispodairy.com", password: "vet123", avatar: "https://lh3.googleusercontent.com/aida-public/AB6AXuBhCyxLO2Hb3F75HAUXLZIJGTVsyM1Ul7FTiwJRExwn5Pz1_ApGAgfv2ceaglS0MC7WhJSf53ug7F_eRdgVjdq89nIZuOIEPvhxF4HD1kPKvrXCkVISs6e64xjBybc6BWadyXRhSQE6hm2sT33F0ZonszGQ6UxaZKKZgTNCkUFfRhriOR36eQD_ZlvoKObiWijAuy1NTe-Piv4keH0WAqqr2CHfT6vSX09KE5EHCYqTVGL6GX8tRBu9M_E5XdMsGkvU-GyH5IY5Eww" },
            { id: 5, name: "Dra. Maria Mendoza (Alt)", role: "Veterinario", status: "Activo", email: "veterinario@obispodairy.com", password: "veterinario1", avatar: "https://lh3.googleusercontent.com/aida-public/AB6AXuBhCyxLO2Hb3F75HAUXLZIJGTVsyM1Ul7FTiwJRExwn5Pz1_ApGAgfv2ceaglS0MC7WhJSf53ug7F_eRdgVjdq89nIZuOIEPvhxF4HD1kPKvrXCkVISs6e64xjBybc6BWadyXRhSQE6hm2sT33F0ZonszGQ6UxaZKKZgTNCkUFfRhriOR36eQD_ZlvoKObiWijAuy1NTe-Piv4keH0WAqqr2CHfT6vSX09KE5EHCYqTVGL6GX8tRBu9M_E5XdMsGkvU-GyH5IY5Eww" },
            { id: 3, name: "Jose Sanchez", role: "Operario", status: "Inactivo", email: "jose@obispodairy.com", password: "ope123", avatar: "JS" },
            { id: 6, name: "Jose Sanchez (Alt)", role: "Operario", status: "Activo", email: "operador1@obispodairy.com", password: "operador1", avatar: "JS" },
            { id: 4, name: "Ana Valero", role: "Operario", status: "Activo", email: "ana@obispodairy.com", password: "ope123", avatar: "AV" },
            { id: 7, name: "Ana Valero (Alt)", role: "Operario", status: "Activo", email: "operador2@obispodairy.com", password: "operador2", avatar: "AV" }
          ];

          let usersList = fallbackUsers;
          const storedUsers = localStorage.getItem('localUsersData');
          if (storedUsers) {
            try {
              usersList = JSON.parse(storedUsers);
            } catch (e) {
              console.error(e);
            }
          }

          const user = usersList.find(u => u.email === this.email && u.password === this.password);
          if (user) {
            if (user.status !== 'Activo') {
              this.errorMsg = "Su cuenta ha sido desactivada. Por favor comuníquese con el admin.";
            } else {
              localStorage.setItem('loggedInUser', JSON.stringify(user));
              window.location.href = 'index.html';
            }
          } else {
            this.errorMsg = "Credenciales incorrectas (Modo Local)";
          }
        }
      }
    }).mount('#app');
  </script>
